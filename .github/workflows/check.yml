name: Proxy Checker Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch: {}       # manual trigger button

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx[http2] socksio

      - name: Run proxy checker
        run: python bot.py --once

      - name: Commit results
        run: |
          git config user.name "Proxy Bot"
          git config user.email "bot@proxy.bot"
          git add -f output/
          git diff --cached --quiet || git commit -m "Update working proxies $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
